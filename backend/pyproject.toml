[project]
name = "our-story-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "PyJWT>=2.10,<3",
  "argon2-cffi>=23.1,<26",
  "python-multipart>=0.0.20,<1",
  "Pillow>=11,<13",
  "email-validator>=2.2,<3",
  "vercel-blob>=0.5,<1",
]

[tool.vercel]
entrypoint = "app.main:app"
