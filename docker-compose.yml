services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-our_memories}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-our_memories}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-our_memories} -d ${POSTGRES_DB:-our_memories}"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-our_memories}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-our_memories}
      UPLOAD_DIR: /app/uploads
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN_DOCKER:-http://localhost:8080}
    volumes:
      - media_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  scheduler:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-our_memories}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-our_memories}
    depends_on:
      - backend
    command: python -m app.scheduler
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
volumes:
  postgres_data:
  media_data:

